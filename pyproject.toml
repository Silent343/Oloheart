[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oloheart"
version = "0.1.0"
description = "Native, gesture-driven cardiac anatomy workstation for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.0.1",
    "numpy>=2.5",
    "opencv-contrib-python>=5.0",
    "pillow>=12.3",
    "PyOpenGL>=3.1",
    "PySide6>=6.11",
]

[project.scripts]
oloheart = "oloheart.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
